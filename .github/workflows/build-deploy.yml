name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    environment:
      name: testing
    env:
      database_hostname: localhost
      database_port: 5432
      database_username: postgres
      database_password: ${{ secrets.DATABASE_PASSWORD }}
      database_name: job_boards
      secret_key: ${{ secrets.SECRET_KEY }}
      algorithm: HS256
      access_token_expire_minutes: 30
      redis_url: redis://localhost:6379/0
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          POSTGRES_USER: postgres
          POSTGRES_DB: job_boards
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test database
        env:
          PGPASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          psql -h localhost -U postgres -d job_boards -c "CREATE DATABASE job_boards_test;"

      - name: Run tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            asadkhn10/job-boards-api:latest
            asadkhn10/job-boards-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.OCI_HOST }}
          DEPLOY_USER: ${{ secrets.OCI_USERNAME }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'EOF'
          set -e
          cd ~/app
          docker compose -f docker-compose-prod.yml pull
          docker compose -f docker-compose-prod.yml run --rm -T --no-deps api alembic upgrade head < /dev/null
          docker compose -f docker-compose-prod.yml up -d --wait
          docker compose -f docker-compose-prod.yml exec -T nginx nginx -s reload < /dev/null
          EOF

      - name: Smoke test
        run: |
          curl -fsS --retry 6 --retry-delay 5 --retry-connrefused https://job-boards-api.duckdns.org/